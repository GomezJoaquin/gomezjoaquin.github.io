#baseURL: "https://hugo-profile.netlify.app"
baseURL: "https://gomezjoaquin.github.io"
title: "Joaquín Gómez"
theme: hugo-profile

# --- Multilingual ---------------------------------------------------------
# English is the default and lives at the site root (/blogs/...).
# Spanish lives under /es/ (/es/blogs/...).
# Post files are named <slug>.en.md and <slug>.es.md.
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

pagination:
  pagerSize: 10
enableRobotsTXT: true
# disqusShortname: your-disqus-shortname
# Google Analytics — disabled until a real ID is set.
# It used to be the template's literal placeholder (G-MEASUREMENT_ID), which
# injected a tracking script pointing at a property that does not exist:
# no data collected, one useless request per page load.
# Put your real measurement ID here (format G-XXXXXXXXXX) to enable it.
# googleAnalytics: ""

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs
      weight: 1

# --- Languages ------------------------------------------------------------
# Each language block below overrides COMPLETE top-level params blocks.
# Anything not listed here (theme, font, favicon, listPages, singlePages...)
# is inherited from the root `params` below.
languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1
    title: "Joaquín Gómez"

  es:
    languageName: "Español"
    languageCode: "es"
    weight: 2
    title: "Joaquín Gómez"
    menus:
      main:
        - identifier: blog
          name: Blog
          title: Artículos
          url: /es/blogs
          weight: 1
    params:
      title: "Joaquín Gómez - DevOps Engineer | AWS Solutions Architect Associate"
      description: "Ingeniero DevOps trabajando con AWS, Kubernetes y automatización de CI/CD. AWS Certified Solutions Architect – Associate. Escribo sobre pipelines de entrega, operación de clusters y las decisiones detrás."
      images:
        - "/images/og/default.png"

      hero:
        enable: true
        intro: "Hola, soy"
        title: "Joaquín Gómez"
        subtitle: "DevOps Engineer · AWS Solutions Architect Associate"
        content: "Construyo y opero pipelines de entrega sobre AWS y Kubernetes. Escribo sobre las decisiones detrás — incluidas las que salieron mal."
        image: /images/hero.png
        roundImage: true
        button:
          enable: true
          name: "Ver mi trabajo"
          url: "/es/blogs"
          download: false
          newPage: false
        socialLinks:
          fontAwesomeIcons:
            - icon: fab fa-github
              url: https://github.com/GomezJoaquin
            - icon: fab fa-linkedin-in
              url: https://www.linkedin.com/in/joaquingomezalonso/

      about:
        enable: true
        title: "Sobre mí"
        image: "/images/me.jpg"
        content: |
          Ingeniero DevOps en Montevideo, Uruguay. Trabajo desde 2021 en la misma empresa, donde pasé por desarrollo, arquitectura e infraestructura antes de dedicarme a DevOps.

          Mi trabajo diario es sobre AWS: pipelines de CI/CD, infraestructura como código y automatización de operaciones. Fuera del trabajo estoy construyendo profundidad operativa en Kubernetes — no desplegar, sino operar: qué pasa cuando un nodo se cae, cuándo abortar un deploy, y por qué.

          Escribo acá para documentar decisiones técnicas con sus trade-offs, y postmortems de lo que se rompe. Prefiero un artículo verificable a uno impresionante.
        skills:
          enable: true
          title: "Stack técnico"
          items:
            - "AWS: EC2, S3, RDS, IAM, Lambda, CloudFormation"
            - "Kubernetes (kind, k3d) y Docker"
            - "Terraform"
            - "GitHub Actions, GitLab CI"
            - "Linux y scripting (Bash, Python)"
            - "Git"

      experience:
        enable: true
        title: "Experiencia"
        items:
          - job: "DevOps Engineer"
            company: "GeneXus Consulting"
            companyUrl: "https://www.genexusconsulting.com/"
            date: "Sep 2021 - Presente"
            featuredLink:
              enable: false
            content: |
              • Diseño y mantenimiento de pipelines de CI/CD para proyectos de clientes

              • Gestión de infraestructura AWS (EC2, S3, RDS, Lambda) con infraestructura como código

              • Automatización de tareas operativas repetitivas del ciclo de vida de despliegue

              • Roles previos en la misma empresa: desarrollo, arquitectura e infraestructura

      education:
        enable: true
        title: "Formación"
        index: false
        items:
          - title: "Tecnólogo en Informática"
            school:
              name: "Universidad de la República - UTEC, Uruguay"
              url: "https://utec.edu.uy/es/educacion/carrera/tecnologo-en-informatica/"
            date: "2017 - 2021"
          - title: "Bachiller Tecnológico en Informática"
            school:
              name: "Polo Educativo Tecnológico Arrayanes"
            date: "2014 - 2016"

      achievements:
        enable: true
        title: "Certificaciones"
        items:
          - title: "AWS Certified Solutions Architect – Associate"
            content: |
              Valida la capacidad de diseñar soluciones seguras, escalables y con buena relación costo-beneficio sobre AWS.
            url: https://www.credly.com/badges/5fb6c7af-0cfe-404b-abdb-f2f1f181a516
            image: /images/aws-solutions-architect-associate.png
          - title: "AWS Certified Cloud Practitioner"
            content: |
              Valida conocimiento fundacional de conceptos, servicios, seguridad y modelo de precios de AWS.
            url: https://www.credly.com/badges/dc0a3411-721b-45ed-88df-02b271e2b570
            image: /images/aws-cloud-practitioner.png
          - title: "Azure Fundamentals (AZ-900)"
            content: |
              Valida conocimiento de conceptos de nube y servicios core de Azure.
            url: https://learn.microsoft.com/api/credentials/share/es-mx/JoaqunGmez-2593/16A11669F0EE1F91?sharingId
            image: /images/azure-az.png

      contact:
        enable: true
        title: "Contacto"
        content: |
          Si querés hablar de infraestructura, Kubernetes o de algo que hayas leído acá, escribime.
        btnName: "Escribime"
        btnLink: mailto:ggomezjjoaquin@gmail.com

      navbar:
        align: ms-auto
        brandName: "Joaquín Gómez"
        disableSearch: false
        searchPlaceholder: "Ctrl + k para buscar..."
        stickyNavBar:
          enable: true
          showOnScrollUp: true
        enableSeparator: false
        menus:
          disableAbout: false
          disableExperience: false
          disableEducation: false
          disableProjects: true
          disableAchievements: false
          disableContact: false

      footer:
        recentPosts:
          path: "blogs"
          count: 3
          title: "Artículos recientes"
          enable: true
        socialNetworks:
          github: https://github.com/GomezJoaquin
          linkedin: https://www.linkedin.com/in/joaquingomezalonso/

      terms:
        read: "Leer"
        toc: "Contenido"
        copyright: "Todos los derechos reservados"
        pageNotFound: "Página no encontrada"
        emailText: "Mirá este sitio"

      singlePages:
        socialShare: true
        readTime:
          enable: true
          content: "min de lectura"
        scrollprogress:
          enable: true
        tags:
          openInNewTab: true

      datesFormat:
        article: "2 Jan 2006"
        articleList: "2 Jan 2006"
        articleRecent: "2 Jan 2006"

