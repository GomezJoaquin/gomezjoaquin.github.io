    content: |
      DevOps Engineer based in Montevideo, Uruguay. I've been at the same company since 2021, moving through development, architecture and infrastructure before settling into DevOps.

      My day job is on AWS: CI/CD pipelines, infrastructure as code, and automating operational work. Outside of it I'm building operational depth in Kubernetes — not deploying, but operating: what happens when a node goes away, when to abort a rollout, and why.

      I write here to document technical decisions with their trade-offs, and postmortems of what breaks. I'd rather publish something verifiable than something impressive.
